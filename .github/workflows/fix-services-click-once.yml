name: Fix Services click behavior once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch only the Services click handler
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = '''  servicesToggle.addEventListener('click', (event) => {\n    if (window.innerWidth <= 820) {\n      event.preventDefault();\n      servicesMenu.classList.toggle('open');\n    }\n  });'''
          new = '''  servicesToggle.addEventListener('click', (event) => {\n    event.preventDefault();\n    servicesMenu.classList.toggle('open');\n  });'''
          if old not in s:
              raise SystemExit('Expected Services click handler was not found; no changes made.')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Verify homepage safety and exact change
        run: |
          grep -q 'class="logo"' index.html
          grep -q 'class="menu"' index.html
          grep -q 'services-menu' index.html
          grep -q "servicesMenu.classList.toggle('open')" index.html
          test "$(git diff --numstat | awk '{add+=$1; del+=$2} END {print add \"+\" del}')" = "1 1"
          git diff --check

      - name: Commit exact fix and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/fix-services-click-once.yml
          git commit -m 'Fix Services dropdown click behavior'
          git push origin main
